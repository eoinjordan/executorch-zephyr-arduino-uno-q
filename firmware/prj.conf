# ExecuTorch runtime, selective operator build
CONFIG_EXECUTORCH=y
CONFIG_EXECUTORCH_BUILD_PORTABLE_OPS=n
CONFIG_EXECUTORCH_ENABLE_LOGGING=y

# C++17 with full libstdc++
CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Cortex-M33 FPU, hard-float ABI
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_PRINTK=y

# A0 on ADC1, RGB LEDs on GPIO
CONFIG_GPIO=y
CONFIG_ADC=y

CONFIG_EXECUTORCH_METHOD_ALLOCATOR_POOL_SIZE=65536
CONFIG_EXECUTORCH_TEMP_ALLOCATOR_POOL_SIZE=8192
